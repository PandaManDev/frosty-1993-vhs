
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d18">
  <meta name="description" content="Watch Frosty 1993 VHS online.">
  <title>Frosty — 1993 VHS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #100d18;
      color: #fff;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 1000px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: #8b5cf6;
      font-size: 28px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(24px, 5vw, 38px);
    }

    .subtitle {
      color: #b8adc9;
      margin: 0;
    }

    .player {
      padding: 10px;
      border: 1px solid #382849;
      border-radius: 20px;
      background: #191322;
      box-shadow: 0 0 40px #8b5cf622;
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
    }

  </style>
</head>

<body>
  <main>
    <header class="header">
      <div class="icon" aria-hidden="true">❄</div>
      <div>
        <h1>Frosty — 1993 VHS</h1>
        <p class="subtitle">A classic holiday viewing page</p>
      </div>
    </header>

    <section class="player">
      <video
        controls
        playsinline
        preload="metadata"
        aria-label="Frosty 1993 VHS video"
      >
        <source
          src="https://dn721908.ca.archive.org/0/items/frosty-1993-vhs/Frosty%201993%20VHS.mp4"
          type="video/mp4"
        >
        Your browser does not support HTML5 video.
        <a href="https://dn721908.ca.archive.org/0/items/frosty-1993-vhs/Frosty%201993%20VHS.mp4">
          Open the video directly
        </a>.
      </video>
    </section>




  </main>
</body>
</html>

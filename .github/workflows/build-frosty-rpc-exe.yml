name: Build and Release Frosty Discord RPC EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'discord-rpc/**'
      - '.github/workflows/build-frosty-rpc-exe.yml'
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        working-directory: discord-rpc
        run: npm install
      - name: Package Windows executable
        working-directory: discord-rpc
        run: npx --yes pkg app.js --targets node18-win-x64 --output FrostyDiscordRPC.exe
      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item discord-rpc/FrostyDiscordRPC.exe dist/
          Copy-Item discord-rpc/README.md dist/
          Set-Content -Path dist/START-HERE.txt -Value @('Frosty Discord Rich Presence','', '1. Install and open the Discord desktop app.', '2. Double-click FrostyDiscordRPC.exe.', '3. Keep the console window open while the status is active.', '4. Type p for Watching Frosty, a for Paused, r to reset the timer, or q to quit.', '', 'This executable is unsigned. Only run it if you trust this source repository.')
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrostyDiscordRPC-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publish EXE to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: frosty-rpc-latest
          name: Frosty Discord RPC (Latest Windows Build)
          body: |
            Windows x64 executable for the Frosty 1993 VHS Discord Rich Presence companion.

            **Install:** Download `FrostyDiscordRPC.exe` and `START-HERE.txt` below. Open the Discord desktop app before launching the EXE. Keep its console window open while the status is active.

            Controls: `p` = Watching Frosty, `a` = Paused, `r` = reset timer, `q` = quit.

            Note: This executable is unsigned. Rich Presence uses Discord desktop IPC. Browser playback is not automatically detected.
          files: |
            dist/FrostyDiscordRPC.exe
            dist/START-HERE.txt
            dist/README.md
          overwrite_files: true
          make_latest: true
